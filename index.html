<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Daily Edit</title>
    <meta name="description" content="A little space for everything that matters. Tareas, proyectos y planificación diaria." />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Daily Edit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <script>
      // Aplica la apariencia guardada antes de pintar (evita el destello del tema predeterminado).
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem('tde-appearance') || 'null');
          if (!a) return;
          var el = document.documentElement;
          if (/^(olive|rose|sage|blue)$/.test(a.palette)) el.dataset.palette = a.palette;
          if (/^(playful|editorial|clean)$/.test(a.font)) el.dataset.font = a.font;
          if (/^(soft|round)$/.test(a.radius)) el.dataset.radius = a.radius;
          var bg = { olive: '#FAF9F6', rose: '#FFF9F7', sage: '#FAF9F3', blue: '#FAFAF7' }[a.palette];
          if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The Daily Edit necesita JavaScript activado.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
